<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDP 原型阅读器</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div id="topbar">
  <span class="logo">SDP</span>
  <span class="sep">|</span>
  <select id="version-select"></select>
  <span id="current-module" style="color:#999;font-size:13px">—</span>
  <label id="diff-toggle" title="显示/隐藏变更标记">
    <input type="checkbox" id="diff-toggle-cb" checked>
    变更标记
  </label>
  <button id="changelog-btn">变更清单</button>
</div>

<!-- ===== MAIN LAYOUT ===== -->
<div id="layout">

  <!-- Left nav -->
  <div id="nav">
    <div id="nav-scroll"></div>
  </div>

  <!-- Center: breadcrumb + iframe -->
  <div id="page-area">
    <div id="breadcrumb">
      <span>—</span>
    </div>
    <iframe id="page-frame" style="display:none"></iframe>
    <div id="page-empty" style="display:none">
      <div class="empty-icon">📄</div>
      <div class="empty-text">请从左侧菜单选择页面</div>
    </div>
  </div>

  <!-- Resize handle -->
  <div id="resize-handle"></div>

  <!-- Right doc panel -->
  <div id="doc-panel">
    <div id="doc-panel-header">
      <span class="doc-title" id="doc-panel-title">模块文档</span>
      <button id="doc-collapse-btn" title="折叠/展开文档面板">▶</button>
    </div>
    <div id="doc-toc"></div>
    <div id="doc-loading">
      <div class="spinner"></div>
      <span>加载文档中…</span>
    </div>
    <div id="doc-content"></div>
  </div>

</div>

<!-- ===== CHANGELOG OVERLAY ===== -->
<div id="changelog-overlay">
  <div id="changelog-panel">
    <div id="changelog-panel-header">
      变更清单
      <button id="changelog-close">×</button>
    </div>
    <div id="changelog-body"></div>
  </div>
</div>

<!-- marked.js for md rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<!-- mermaid.js for sequence/flow diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad: false, theme: 'neutral' });</script>
<script src="viewer.js"></script>
</body>
</html>
